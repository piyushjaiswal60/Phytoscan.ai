name: Build, Publish and Deploy Phytoscan

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phytoscan-backend:${{ steps.set-tag.outputs.image_tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phytoscan-frontend:${{ steps.set-tag.outputs.image_tag }}

  deploy-to-ec2:
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.publish-images.outputs.image_tag }}
      INSTANCE_ID: i-03e68317f418e959c
      AWS_REGION: ap-southeast-1

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::887690967783:role/PhytoscanGitHubActionsRole
          aws-region: ap-southeast-1

      - name: Deploy images through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -eu
          cd /home/ssm-user/Phytoscan.ai

          cat > docker-compose.deploy.yml <<'COMPOSE'
          services:
            backend:
              image: ghcr.io/sajaldhuriya/phytoscan-backend:${IMAGE_TAG}
              container_name: phytoscan-backend
              restart: always
              networks:
                - phytoscan-network

            frontend:
              image: ghcr.io/sajaldhuriya/phytoscan-frontend:${IMAGE_TAG}
              container_name: phytoscan-frontend
              restart: always
              ports:
                - "80:80"
              depends_on:
                - backend
              networks:
                - phytoscan-network

          networks:
            phytoscan-network:
              driver: bridge
          COMPOSE

          sudo docker compose -f docker-compose.deploy.yml pull
          sudo docker compose -f docker-compose.deploy.yml up -d --remove-orphans
          sudo docker image prune -f
          sudo docker compose -f docker-compose.deploy.yml ps
          EOF
          )

          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg command "$DEPLOY_SCRIPT" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {commands: [$command]},
              Comment: "Deploy Phytoscan.ai"
            }' > /tmp/ssm-command.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-command.json \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
