version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phytoscan-backend
    ports:
      - "8000:8000"
    networks:
      - phytoscan-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phytoscan-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - phytoscan-network
    restart: always

networks:
  phytoscan-network:
    driver: bridge
